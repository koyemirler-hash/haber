<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emirler Portalı</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="authPage" class="full-page">
        <div class="auth-card">
            <img src="ikon_192.png" class="auth-logo">
            <h2>Emirler Portalı</h2>
            <div id="loginForm">
                <input type="email" id="logEmail" placeholder="E-posta">
                <input type="password" id="logPass" placeholder="Şifre">
                <button class="btn-main" onclick="girisYap()">Giriş Yap</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        
        <header class="app-header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <span id="pageTitle">Köy Meydanı</span>
            <div class="header-spacer"></div>
        </header>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Menü</h3>
                <button onclick="toggleSidebar()">✕</button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item" onclick="tabDegistir('feed')">🏠 Köy Meydanı</div>
                <div class="nav-item" onclick="tabDegistir('chat')">💬 Canlı Sohbet</div>
                <div class="nav-item" onclick="tabDegistir('biz')">🏢 Yerel Firmalar</div>
                <div class="nav-item" onclick="tabDegistir('settings')">⚙️ Ayarlar</div>
                <hr>
                <div class="nav-item logout" onclick="cikisYap()">🚪 Çıkış Yap</div>
            </nav>
        </aside>

        <main id="contentArea">
            <section id="view-feed" class="view">
                <div id="feedList" class="feed-container"></div>
            </section>

            <section id="view-chat" class="view hidden">
                <div id="chatBox" class="chat-container"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" placeholder="Mesaj yazın...">
                    <button onclick="mesajGonder()">➤</button>
                </div>
            </section>

            </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
