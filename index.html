<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emirler Portalı</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>

<div id="termsOverlay" class="overlay">
    <div class="modal">
        <h3>🏡 Emirler Köyü</h3>
        <div class="terms-box">1. Küfür yasaktır. 2. Veriler güvendedir. 3. Cihaz kilidi aktiftir.</div>
        <label><input type="checkbox" id="termsCheck"> Okudum, kabul ediyorum.</label>
        <button class="btn" onclick="onayVer()">Başlat</button>
    </div>
</div>

<div id="app" class="hidden">
    <section id="authPage" class="view">
        <div class="auth-card">
            <h2>Hoş Geldiniz</h2>
            <div id="loginForm">
                <input type="email" id="logEmail" placeholder="E-posta">
                <input type="password" id="logPass" placeholder="Şifre">
                <button class="btn" onclick="girisYap()">Giriş Yap</button>
                <p onclick="toggleAuth(true)">Kayıt Ol</p>
            </div>
            <div id="registerForm" class="hidden">
                <input type="text" id="regName" placeholder="Ad Soyad">
                <input type="email" id="regEmail" placeholder="E-posta">
                <input type="password" id="regPass" placeholder="Şifre">
                <button class="btn" onclick="kayitOl()">Kayıt Ol</button>
                <p onclick="toggleAuth(false)">Giriş Yap</p>
            </div>
        </div>
    </section>

    <main id="mainContent" class="hidden">
        <section id="view-feed" class="view">
            <div class="top-bar">Köy Meydanı</div>
            <div id="adminPostPanel" class="post-creator hidden">
                <input type="text" id="postTitle" placeholder="Ne düşünüyorsun?">
                <input type="file" id="postFile">
                <button onclick="paylas()">Paylaş</button>
            </div>
            <div id="feedList" class="feed-container"></div>
        </section>

        <section id="view-chat" class="view hidden">
            <div class="chat-container">
                <div id="chatBox" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Mesaj yaz...">
                    <button onclick="mesajGonder()">➤</button>
                </div>
            </div>
        </section>

        <section id="view-biz" class="view hidden">
            <div id="bizList" class="biz-slider"></div>
        </section>

        <section id="view-settings" class="view hidden">
            <div class="settings-card">
                <p id="userMailInfo"></p>
                <button class="btn-logout" onclick="cikisYap()">Çıkış Yap</button>
            </div>
            <div id="adminMasterPanel" class="admin-panel hidden">
                <h4>🛡️ Yönetim Paneli</h4>
                <div id="adminUserList"></div>
            </div>
        </section>
    </main>

    <nav id="navBar" class="nav-bar hidden">
        <div onclick="tabDegistir('feed')">🏠<span>Meydan</span></div>
        <div onclick="tabDegistir('chat')">💬<span>Sohbet</span></div>
        <div onclick="tabDegistir('biz')">🏢<span>Firmalar</span></div>
        <div onclick="tabDegistir('settings')">⚙️<span>Ayarlar</span></div>
    </nav>
</div>

<script src="app.js"></script>
</body>
</html>
