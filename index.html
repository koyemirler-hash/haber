<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emirler Köyü Portalı</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --p: #4a5568; --bg: #f8f9fa; --accent: #588157; --orange: #ff6000; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 75px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 10px; }
        .hidden { display: none !important; }
        
        /* 📂 AÇILIR MENÜ (ACCORDION) */
        .acc-btn { width: 100%; padding: 15px; background: #edf2f7; border: none; text-align: left; font-weight: bold; border-radius: 10px; margin-top: 5px; cursor: pointer; display: flex; justify-content: space-between; }
        .acc-content { padding: 10px; border: 1px solid #edf2f7; border-radius: 0 0 10px 10px; margin-bottom: 10px; }

        /* 📸 AKIŞ GÖNDERİM PANELİ (SADECE YÖNETİM) */
        #adminPostBox { background: #f0f4f0; border: 2px dashed var(--accent); }
        .post-media { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 250px; object-fit: cover; }

        /* 💬 SOHBET */
        .chat-box { height: 350px; overflow-y: auto; background: #e5ddd5; padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: white; }

        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .nav-footer { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 1000; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-feed" class="view">
        <div class="card" style="background:var(--accent); color:white; text-align:center; margin:0; border-radius:0 0 20px 20px;">
            <h3>Köy Meydanı</h3>
        </div>
        
        <div id="adminPostBox" class="card hidden">
            <p>📢 <b>Yönetim Paylaşımı</b></p>
            <input id="postTitle" placeholder="Başlık yazın...">
            <input type="file" id="postFile" accept="image/*,video/*">
            <button class="btn" onclick="akisPaylas()">Yayına Ver</button>
        </div>
        <div id="feedList"></div>
    </div>

    <div id="view-chat" class="view hidden">
        <div class="card">
            <h4>💬 Köy Sohbeti</h4>
            <div id="chatBox" class="chat-box"></div>
            <div style="margin-top:10px;">
                <input id="chatMsg" placeholder="Mesajınız...">
                <input type="file" id="chatFile" accept="image/*">
                <button class="btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <div id="view-biz" class="view hidden">
        <div id="bizList" class="card"></div>
    </div>

    <div id="view-settings" class="view hidden">
        <div class="card">
            <h3>⚙️ Uygulama Ayarları</h3>
            
            <button class="acc-btn" onclick="toggleAcc('acc-admin')">🛡️ Yönetim Paneli <span>▼</span></button>
            <div id="acc-admin" class="acc-content hidden">
                <p><b>Firma Ekle/Düzenle</b></p>
                <input id="fName" placeholder="Firma Adı">
                <input id="fTel" placeholder="Telefon">
                <input id="fWeb" placeholder="Web/Gmail">
                <button class="btn" onclick="firmaEkle()">Kaydet</button>
                <hr>
                <p><b>Bekleyen Onaylar</b></p>
                <div id="pendingUsers">Yükleniyor...</div>
            </div>

            <button class="acc-btn" onclick="toggleAcc('acc-ads')">💰 Reklam Yönetimi <span>▼</span></button>
            <div id="acc-ads" class="acc-content hidden">
                <input id="adText" placeholder="Reklam Yazısı">
                <input id="adLink" placeholder="Link">
                <button class="btn" style="background:var(--orange)" onclick="reklamGuncelle()">Güncelle</button>
            </div>

            <button class="acc-btn" onclick="toggleAcc('acc-online')">👥 Kimler Online? <span>▼</span></button>
            <div id="acc-online" class="acc-content hidden">
                <div id="onlineUsers"></div>
            </div>

            <div class="card" style="text-align:center;">
                <p>Uygulama Karekodu</p>
                <img src="karekod.png" width="100">
            </div>

            <button class="btn" style="background:#e53e3e; margin-top:20px;" onclick="auth.signOut(); location.reload();">🚪 Çıkış Yap</button>
        </div>
    </div>
</div>

<nav class="nav-footer">
    <span onclick="tabGit('feed')">🏠 Akış</span>
    <span onclick="tabGit('chat')">💬 Sohbet</span>
    <span onclick="tabGit('biz')">🏢 Rehber</span>
    <span onclick="tabGit('settings')">⚙️ Ayarlar</span>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyDUagdaIoJmkgGjWFv2avYsC7n_-4AJ7s0",
    authDomain: "emirler-c5638.firebaseapp.com",
    projectId: "emirler-c5638",
    storageBucket: "emirler-c5638.firebasestorage.app", // BURAYI DÜZELTTİM
    appId: "1:426225264136:web:ca5184984fc71b1e63853bd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

let userRole = 'user';

// 🛡️ AUTH VE ROL KONTROLÜ
auth.onAuthStateChanged(async user => {
    if(user) {
        const doc = await db.collection("users").doc(user.uid).get();
        userRole = (user.email === "koyemirler@gmail.com") ? "admin" : (doc.data()?.role || "user");
        
        // Yönetim panellerini aç
        if(["admin", "muhtar", "yardimci"].includes(userRole)) {
            document.getElementById('adminPostBox').classList.remove('hidden');
        }
        tabGit('feed');
        onlineTakip();
        mesajDinle();
    } else {
        // Kayıt/Giriş ekranına yönlendir (Önceki kodundaki auth yapısını buraya ekleyebilirsin)
    }
});

// 📸 AKIŞA RESİMLİ PAYLAŞIM
async function akisPaylas() {
    const file = document.getElementById('postFile').files[0];
    const title = document.getElementById('postTitle').value;
    let url = "";

    if(file) {
        const ref = storage.ref(`posts/${Date.now()}_${file.name}`);
        await ref.put(file);
        url = await ref.getDownloadURL();
    }

    await db.collection("announcements").add({
        title, image: url, sender: userRole, time: Date.now()
    });
    alert("Paylaşıldı!");
}

// 💬 SOHBET (RESİM DÜZELTİLDİ)
async function mesajGonder() {
    const msg = document.getElementById('chatMsg').value;
    const file = document.getElementById('chatFile').files[0];
    let mUrl = "";

    if(file) {
        // Storage referans hatası düzeltildi kanki
        const ref = storage.ref(`chat/${Date.now()}_${file.name}`);
        try {
            await ref.put(file);
            mUrl = await ref.getDownloadURL();
        } catch(e) { console.error("Yükleme hatası:", e); }
    }

    await db.collection("chat").add({
        text: msg, media: mUrl, user: auth.currentUser.email.split('@')[0],
        uid: auth.currentUser.uid, time: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('chatMsg').value = "";
    document.getElementById('chatFile').value = "";
}

function mesajDinle() {
    db.collection("chat").orderBy("time","asc").limitToLast(20).onSnapshot(snap => {
        let h = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.uid === auth.currentUser.uid;
            h += `<div class="msg ${isMe ? 'sent' : 'received'}">
                <b>${m.user}</b><br>
                ${m.media ? `<img src="${m.media}" class="post-media">` : ''}
                ${m.text}
            </div>`;
        });
        const b = document.getElementById('chatBox');
        b.innerHTML = h; b.scrollTop = b.scrollHeight;
    });
}

// 📂 AYARLAR YÖNETİMİ
function toggleAcc(id) {
    document.getElementById(id).classList.toggle('hidden');
}

function tabGit(t) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('view-'+t).classList.remove('hidden');
}

function onlineTakip() {
    db.collection("users").onSnapshot(snap => {
        let h = "";
        snap.forEach(doc => { h += `<div>• ${doc.data().name}</div>`; });
        document.getElementById('onlineUsers').innerHTML = h;
    });
}
</script>
</body>
</html>
