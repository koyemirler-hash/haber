<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emirler Köyü</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --p: #4a5568; --bg: #f8f9fa; --accent: #588157; --orange: #ff6000; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 75px; }
        .card { background: var(--white); padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 10px; position: relative; }
        .hidden { display: none !important; }
        
        /* 🖼️ RESİM/VİDEO VE SOHBET */
        .post-media { width: 100%; border-radius: 10px; margin: 10px 0; max-height: 300px; object-fit: cover; }
        .chat-box { height: 400px; overflow-y: auto; background: #e5ddd5; padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; position: relative; font-size: 14px; }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: white; }
        .msg-tools { font-size: 10px; color: #888; margin-top: 5px; cursor: pointer; }

        /* 🏢 FİRMALAR (Snap Scroll) */
        .biz-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding: 10px; }
        .biz-card { min-width: 80%; scroll-snap-align: center; background: white; border-radius: 20px; padding: 20px; border-top: 5px solid var(--accent); }

        /* ⚙️ PANEL TASARIMI */
        .admin-only { border: 2px dashed var(--accent); padding: 15px; border-radius: 15px; margin: 10px; background: #f0f4f0; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .nav-footer { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 1000; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="card" id="login-form">
        <h3 style="text-align:center;">🔑 Giriş / Kayıt</h3>
        <input id="email" type="email" placeholder="E-posta">
        <input id="pass" type="password" placeholder="Şifre">
        <input id="username" type="text" placeholder="Ad Soyad (Sadece Kayıt İçin)">
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="authEylem('login')">Giriş Yap</button>
            <button class="btn" style="background:#4a5568" onclick="authEylem('register')">Kayıt Ol</button>
        </div>
        <p id="auth-hata" style="color:red; font-size:12px; text-align:center;"></p>
    </div>
</div>

<div id="app" class="hidden">
    <div id="view-feed" class="view">
        <div class="card" style="background:var(--accent); color:white; text-align:center; margin:0; border-radius:0 0 20px 20px;">
            <h3>Köy Meydanı</h3>
        </div>
        <div id="feed-container"></div>
    </div>

    <div id="view-chat" class="view hidden">
        <div class="card">
            <h4>💬 Köy Sohbeti</h4>
            <div id="chat-list" class="chat-box"></div>
            <div style="margin-top:10px;">
                <input id="chat-msg" placeholder="Mesaj yaz veya resim seç...">
                <input type="file" id="chat-file" accept="image/*,video/*" style="font-size:10px;">
                <button class="btn" onclick="mesajGonder()">Gönder</button>
            </div>
        </div>
    </div>

    <div id="view-biz" class="view hidden">
        <div class="card"><h3>🏢 Köy Rehberi</h3></div>
        <div class="biz-container" id="biz-list"></div>
    </div>

    <div id="view-settings" class="view hidden">
        <div class="card">
            <h3>⚙️ Ayarlar</h3>
            
            <div id="admin-panel" class="hidden admin-only">
                <h4>🛡️ Yönetim Paneli</h4>
                <p><b>Firma Ekle/Düzenle</b></p>
                <input id="f_ad" placeholder="Firma Adı">
                <input id="f_tel" placeholder="Telefon (05xx)">
                <input id="f_site" placeholder="Web/Gmail">
                <button class="btn" onclick="firmaEkle()">Firmayı Kaydet</button>
                <hr>
                <p><b>Bekleyen Üye Onayları</b></p>
                <div id="pending-users"></div>
            </div>

            <button class="btn" style="background:#e53e3e; margin-top:20px;" onclick="cikis()">🚪 Çıkış Yap</button>
        </div>
    </div>
</div>

<nav class="nav-footer hidden" id="main-nav">
    <span onclick="tabGit('feed')">🏠 Akış</span>
    <span onclick="tabGit('chat')">💬 Sohbet</span>
    <span onclick="tabGit('biz')">🏢 Rehber</span>
    <span onclick="tabGit('settings')">⚙️ Ayarlar</span>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDUagdaIoJmkgGjWFv2avYsC7n_-4AJ7s0",
    authDomain: "emirler-c5638.firebaseapp.com",
    projectId: "emirler-c5638",
    storageBucket: "emirler-c5638.appspot.com",
    appId: "1:426225264136:web:ca5184984fc71b1e63853bd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

const KUFURLER = ["kufur1", "kufur2"]; // Burayı istediğin kelimelerle doldurabilirsin kanki

let currentUser = null;
let userRole = 'user';

// 🔑 AUTH VE KAYIT SİSTEMİ
async function authEylem(type) {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    const name = document.getElementById('username').value;
    
    try {
        if(type === 'register') {
            const res = await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection("users").doc(res.user.uid).set({
                name, email, role: 'user', approved: false, time: Date.now()
            });
            alert("Kayıt alındı! Muhtar onayından sonra girebilirsin.");
        } else {
            const res = await auth.signInWithEmailAndPassword(email, pass);
            const doc = await db.collection("users").doc(res.user.uid).get();
            if(!doc.data().approved && email !== "koyemirler@gmail.com") {
                auth.signOut();
                return alert("Üyeliğin henüz onaylanmamış kanki!");
            }
        }
    } catch(e) { document.getElementById('auth-hata').innerText = "Hata: " + e.message; }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        currentUser = user;
        const doc = await db.collection("users").doc(user.uid).get();
        userRole = (user.email === "koyemirler@gmail.com") ? "admin" : (doc.data()?.role || "user");
        
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('main-nav').classList.remove('hidden');
        if(userRole === "admin" || userRole === "muhtar") document.getElementById('admin-panel').classList.remove('hidden');
        
        tabGit('feed');
        firmalariGetir();
        mesajlariDinle();
    }
});

// 💬 SOHBET VE MEDYA PAYLAŞIMI
async function mesajGonder() {
    let msg = document.getElementById('chat-msg').value;
    const file = document.getElementById('chat-file').files[0];
    
    // Küfür Filtresi
    KUFURLER.forEach(k => msg = msg.replace(new RegExp(k, 'gi'), '***'));

    let mediaUrl = null;
    if(file) {
        const ref = storage.ref(`chat/${Date.now()}_${file.name}`);
        await ref.put(file);
        mediaUrl = await ref.getDownloadURL();
    }

    await db.collection("chat").add({
        text: msg, media: mediaUrl, uid: currentUser.uid, user: currentUser.email.split('@')[0],
        time: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('chat-msg').value = "";
    document.getElementById('chat-file').value = "";
}

function mesajlariDinle() {
    db.collection("chat").orderBy("time","asc").limitToLast(30).onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.uid === currentUser.uid;
            html += `
            <div class="msg ${isMe ? 'sent' : 'received'}">
                <b>${m.user}</b><br>
                ${m.media ? `<img src="${m.media}" class="post-media">` : ''}
                ${m.text}
                ${(isMe || userRole !== 'user') ? `<div class="msg-tools" onclick="sil('${doc.id}','chat')">🗑️ Sil</div>` : ''}
            </div>`;
        });
        const box = document.getElementById('chat-list');
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
    });
}

// 🏢 FİRMA YÖNETİMİ (Sadece Admin)
async function firmaEkle() {
    const data = {
        title: document.getElementById('f_ad').value,
        phone: document.getElementById('f_tel').value,
        site: document.getElementById('f_site').value
    };
    await db.collection("businesses").add(data);
    alert("Firma eklendi!");
}

function firmalariGetir() {
    db.collection("businesses").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            const b = doc.data();
            html += `
            <div class="biz-card">
                <h3>${b.title}</h3>
                <div style="display:flex; gap:10px;">
                    <a href="tel:${b.phone}" class="btn" style="background:#48bb78; text-decoration:none; text-align:center;">📞 Ara</a>
                    <a href="${b.site}" target="_blank" class="btn" style="background:#4299e1; text-decoration:none; text-align:center;">🌐 Site</a>
                </div>
            </div>`;
        });
        document.getElementById('biz-list').innerHTML = html;
    });
}

function tabGit(t) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('view-'+t).classList.remove('hidden');
}

async function sil(id, col) { if(confirm("Silinsin mi kanki?")) await db.collection(col).doc(id).delete(); }
async function cikis() { await auth.signOut(); location.reload(); }
</script>
</body>
</html>
